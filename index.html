<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数字パターン予測アプリ (0-6)</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }
        .num-btn:active {
            transform: scale(0.95);
        }
        .prediction-bar {
            transition: width 0.4s ease-in-out;
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col items-center py-8 px-4">

    <div class="max-w-xl w-full bg-slate-800 rounded-2xl shadow-xl p-6 border border-slate-700">
        <header class="text-center mb-6">
            <h1 class="text-2xl font-bold tracking-tight text-indigo-400">🔢 0-6 パターン予測アナライザー</h1>
            <p class="text-sm text-slate-400 mt-1">直近の勢い・遷移パターン・区切りの流れから20回以内の確率を予測</p>
        </header>

        <!-- コントロール・区切りセクション -->
        <section class="mb-6 bg-slate-900/50 p-4 rounded-xl border border-slate-700/50 flex flex-wrap items-center justify-between gap-3">
            <div>
                <span class="text-xs text-slate-400 block">現在の区切り</span>
                <span id="current-session-label" class="text-lg font-bold text-indigo-300">区切り #1</span>
            </div>
            <div class="flex gap-2">
                <button id="btn-new-session" class="bg-indigo-600 hover:bg-indigo-500 text-white text-sm font-semibold px-4 py-2 rounded-lg transition shadow">
                    新しい区切りで開始
                </button>
                <button id="btn-reset" class="bg-rose-900/40 hover:bg-rose-800 text-rose-300 text-sm font-medium px-3 py-2 rounded-lg transition border border-rose-700/50">
                    全リセット
                </button>
            </div>
        </section>

        <!-- 数字入力セクション (0〜6ボタン) -->
        <section class="mb-8 text-center">
            <label class="block text-sm font-medium text-slate-300 mb-3">数値を入力 (ボタン・数字キー・テンキー 0〜6)</label>
            <div class="grid grid-cols-7 gap-1.5 sm:gap-2">
                <button data-num="0" class="num-btn bg-slate-700 hover:bg-indigo-600 text-xl font-bold py-4 rounded-xl border border-slate-600 transition shadow">0</button>
                <button data-num="1" class="num-btn bg-slate-700 hover:bg-indigo-600 text-xl font-bold py-4 rounded-xl border border-slate-600 transition shadow">1</button>
                <button data-num="2" class="num-btn bg-slate-700 hover:bg-indigo-600 text-xl font-bold py-4 rounded-xl border border-slate-600 transition shadow">2</button>
                <button data-num="3" class="num-btn bg-slate-700 hover:bg-indigo-600 text-xl font-bold py-4 rounded-xl border border-slate-600 transition shadow">3</button>
                <button data-num="4" class="num-btn bg-slate-700 hover:bg-indigo-600 text-xl font-bold py-4 rounded-xl border border-slate-600 transition shadow">4</button>
                <button data-num="5" class="num-btn bg-slate-700 hover:bg-indigo-600 text-xl font-bold py-4 rounded-xl border border-slate-600 transition shadow">5</button>
                <button data-num="6" class="num-btn bg-slate-700 hover:bg-indigo-600 text-xl font-bold py-4 rounded-xl border border-slate-600 transition shadow">6</button>
            </div>
            <div class="mt-3 flex justify-between items-center text-xs text-slate-400 px-1">
                <span>総入力回数: <strong id="total-count" class="text-white">0</strong> 回</span>
                <button id="btn-undo" class="hover:text-slate-200 underline disabled:opacity-50" disabled>直前の入力を取り消す (Backspace)</button>
            </div>
        </section>

        <!-- 予測ランキングセクション -->
        <section class="mb-8">
            <div class="flex justify-between items-center mb-3">
                <h2 class="text-lg font-semibold text-slate-200">🏆 パターン予測ランキング (0-6)</h2>
                <span class="text-xs text-indigo-400 bg-indigo-950 px-2 py-1 rounded border border-indigo-800/50">勢い・遷移重視</span>
            </div>
            <div id="prediction-list" class="space-y-2.5">
                <!-- 動的にランキング項目が挿入されます -->
            </div>
        </section>

        <!-- 履歴とトレンドセクション -->
        <section class="border-t border-slate-700 pt-5">
            <div class="flex justify-between items-center mb-3">
                <h3 class="text-sm font-semibold text-slate-300">📜 入力履歴 (直近15件)</h3>
                <span class="text-xs text-slate-500">※全データは自動保存されています</span>
            </div>
            <div id="history-container" class="flex flex-wrap gap-1.5 min-h-[40px] bg-slate-900/40 p-3 rounded-xl border border-slate-800">
                <span class="text-xs text-slate-500 italic">まだ入力がありません</span>
            </div>
        </section>
    </div>

    <!-- JavaScriptのロジック (0〜6対応 & キーボード入力調整) -->
    <script>
        let state = {
            history: [], 
            sessions: [{ id: 1, name: "区切り #1" }]
        };

        const NUMBERS = [0, 1, 2, 3, 4, 5, 6];

        function loadData() {
            const saved = localStorage.getItem('number_predictor_pattern_0to6_state');
            if (saved) {
                try { state = JSON.parse(saved); } catch (e) { console.error(e); }
            }
        }

        function saveData() {
            localStorage.setItem('number_predictor_pattern_0to6_state', JSON.stringify(state));
        }

        function getCurrentSessionId() {
            if (state.sessions.length === 0) {
                state.sessions.push({ id: 1, name: "区切り #1" });
            }
            return state.sessions[state.sessions.length - 1].id;
        }

        function addNumber(num) {
            const parsedNum = parseInt(num);
            if (isNaN(parsedNum) || !NUMBERS.includes(parsedNum)) return;
            
            const sessionId = getCurrentSessionId();
            state.history.push({ num: parsedNum, sessionId: sessionId });
            saveData();
            updateUI();
        }

        function undo() {
            if (state.history.length > 0) {
                state.history.pop();
                saveData();
                updateUI();
            }
        }

        function startNewSession() {
            const newId = state.sessions.length + 1;
            state.sessions.push({ id: newId, name: `区切り #${newId}` });
            saveData();
            updateUI();
        }

        function resetAll() {
            if (confirm("すべての履歴と区切りデータをリセットしますか？")) {
                state = { history: [], sessions: [{ id: 1, name: "区切り #1" }] };
                saveData();
                updateUI();
            }
        }

        // --- パターン・勢い重視の予測ロジック (0〜6) ---
        function calculatePredictions() {
            const history = state.history;
            const currentSessionId = getCurrentSessionId();
            const total = history.length;

            let scores = {};
            NUMBERS.forEach(n => scores[n] = 50);

            if (total === 0) {
                return NUMBERS.map(n => ({
                    num: n,
                    score: 50,
                    rate: (100 / NUMBERS.length).toFixed(1) + "%"
                }));
            }

            // 1. 直近の勢い（ホットハンド）評価
            const recentWindow = history.slice(-12);
            recentWindow.forEach(item => {
                if (scores[item.num] !== undefined) {
                    scores[item.num] += 8;
                }
            });

            // 2. マルコフ連鎖（直前の数値からの遷移パターン）
            if (total >= 2) {
                const lastNum = history[history.length - 1].num;
                let transitionCounts = {};
                NUMBERS.forEach(n => transitionCounts[n] = 0);
                let transitionTotal = 0;

                for (let i = 0; i < history.length - 1; i++) {
                    if (history[i].num === lastNum) {
                        const nextNum = history[i + 1].num;
                        if (transitionCounts[nextNum] !== undefined) {
                            transitionCounts[nextNum]++;
                            transitionTotal++;
                        }
                    }
                }

                if (transitionTotal > 0) {
                    NUMBERS.forEach(n => {
                        const transProb = transitionCounts[n] / transitionTotal;
                        scores[n] += transProb * 60;
                    });
                }
            }

            // 3. 「一区切りの初め」からの進行度パターン
            const currentSessionHistory = history.filter(item => item.sessionId === currentSessionId);
            const sessionPos = currentSessionHistory.length;

            if (sessionPos > 0) {
                let posMatchCounts = {};
                NUMBERS.forEach(n => posMatchCounts[n] = 0);
                let posMatchTotal = 0;

                let sessionGroups = {};
                history.forEach(item => {
                    if (!sessionGroups[item.sessionId]) sessionGroups[item.sessionId] = [];
                    sessionGroups[item.sessionId].push(item.num);
                });

                Object.keys(sessionGroups).forEach(sId => {
                    const sList = sessionGroups[sId];
                    const targetIdx = sessionPos - 1;
                    if (sList[targetIdx] !== undefined && sId != currentSessionId) {
                        const targetNum = sList[targetIdx];
                        if (posMatchCounts[targetNum] !== undefined) {
                            posMatchCounts[targetNum]++;
                            posMatchTotal++;
                        }
                    }
                });

                if (posMatchTotal > 0) {
                    NUMBERS.forEach(n => {
                        const pRate = posMatchCounts[n] / posMatchTotal;
                        scores[n] += pRate * 40;
                    });
                }
            }

            // スコアの正規化と確率計算
            let totalScore = 0;
            NUMBERS.forEach(n => {
                if (scores[n] < 5) scores[n] = 5;
                totalScore += scores[n];
            });

            let results = NUMBERS.map(n => {
                let probability = (scores[n] / totalScore) * 100;
                return {
                    num: n,
                    score: scores[n],
                    rate: probability.toFixed(1) + "%"
                };
            });

            results.sort((a, b) => b.score - a.score);
            return results;
        }

        function updateUI() {
            document.getElementById('total-count').textContent = state.history.length;

            const currentSession = state.sessions[state.sessions.length - 1];
            document.getElementById('current-session-label').textContent = currentSession ? currentSession.name : "区切り #1";

            document.getElementById('btn-undo').disabled = state.history.length === 0;

            const historyContainer = document.getElementById('history-container');
            if (state.history.length === 0) {
                historyContainer.innerHTML = '<span class="text-xs text-slate-500 italic">まだ入力がありません</span>';
            } else {
                historyContainer.innerHTML = '';
                const recent = state.history.slice(-15).reverse();
                recent.forEach((item) => {
                    const badge = document.createElement('span');
                    badge.className = "w-7 h-7 flex items-center justify-center bg-slate-800 text-indigo-300 font-bold text-xs rounded-lg border border-slate-700 shadow-sm";
                    badge.textContent = item.num;
                    historyContainer.appendChild(badge);
                });
            }

            const predictions = calculatePredictions();
            const predictionList = document.getElementById('prediction-list');
            predictionList.innerHTML = '';

            predictions.forEach((pred, index) => {
                const rank = index + 1;
                let rankColor = "text-slate-400 bg-slate-800 border-slate-700";
                if (rank === 1) rankColor = "text-amber-300 bg-amber-950/40 border-amber-600/50 font-bold";
                if (rank === 2) rankColor = "text-slate-200 bg-slate-800 border-slate-600 font-bold";
                if (rank === 3) rankColor = "text-amber-600 bg-amber-950/20 border-amber-900/50 font-bold";

                const itemDiv = document.createElement('div');
                itemDiv.className = `flex items-center justify-between p-3 rounded-xl border ${rankColor} transition`;
                
                itemDiv.innerHTML = `
                    <div class="flex items-center gap-3">
                        <span class="w-6 text-center text-sm font-semibold">${rank}位</span>
                        <span class="w-9 h-9 flex items-center justify-center bg-indigo-600 text-white font-extrabold rounded-lg shadow">${pred.num}</span>
                    </div>
                    <div class="flex-1 mx-4">
                        <div class="w-full bg-slate-700/60 rounded-full h-2 overflow-hidden">
                            <div class="prediction-bar bg-gradient-to-r from-indigo-500 to-teal-400 h-2 rounded-full" style="width: ${pred.rate}"></div>
                        </div>
                    </div>
                    <div class="text-right">
                        <span class="text-sm font-bold text-slate-200">${pred.rate}</span>
                    </div>
                `;
                predictionList.appendChild(itemDiv);
            });
        }

        document.addEventListener('DOMContentLoaded', () => {
            loadData();
            updateUI();

            // クリック入力
            document.querySelectorAll('.num-btn').forEach(button => {
                button.addEventListener('click', () => {
                    addNumber(button.getAttribute('data-num'));
                });
            });

            // キーボード＆テンキー入力サポート
            document.addEventListener('keydown', (e) => {
                // 入力フォーム等にフォーカスがある場合は発動しない
                if (['INPUT', 'TEXTAREA', 'SELECT'].includes(document.activeElement.tagName)) return;

                // 通常の数字キーおよびテンキー (Numpad) の両方に対応
                const validKeys = ['0', '1', '2', '3', '4', '5', '6'];
                if (validKeys.includes(e.key)) {
                    addNumber(e.key);
                } else if (e.key === 'Backspace' || e.key === 'z' || e.key === 'Z') {
                    undo();
                }
            });

            document.getElementById('btn-undo').addEventListener('click', undo);
            document.getElementById('btn-new-session').addEventListener('click', startNewSession);
            document.getElementById('btn-reset').addEventListener('click', resetAll);
        });
    </script>
</body>
</html>
