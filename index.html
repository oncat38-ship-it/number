<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数字パターン予測＆10回クール検証アプリ (1-6)</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }
        .num-btn:active {
            transform: scale(0.95);
        }
        .prediction-bar {
            transition: width 0.4s ease-in-out;
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col items-center py-8 px-4">

    <div class="max-w-xl w-full bg-slate-800 rounded-2xl shadow-xl p-6 border border-slate-700">
        <header class="text-center mb-5">
            <h1 class="text-2xl font-bold tracking-tight text-indigo-400">🔢 10回以内出現パターン予測アナライザー</h1>
            <p class="text-sm text-slate-400 mt-1">今後10回以内に来る確率を算出＆10回検証クールで自動学習</p>
        </header>

        <!-- クール状況・スタートパネル -->
        <section class="mb-5 bg-gradient-to-r from-slate-900 to-indigo-950/60 p-4 rounded-xl border border-indigo-500/30 flex flex-col sm:flex-row items-center justify-between gap-4">
            <div class="text-center sm:text-left">
                <span class="text-xs text-indigo-300 font-semibold uppercase tracking-wider block">10回クール検証状況</span>
                <div class="flex items-baseline gap-2 mt-0.5">
                    <span id="game-status-text" class="text-lg font-bold text-slate-200">待機中 (Qキーでスタート)</span>
                </div>
                <div class="text-xs text-slate-400 mt-1">
                    10回以内的中: <strong id="stat-success" class="text-emerald-400">0</strong>回 / 
                    不的中(学習データ): <strong id="stat-fail" class="text-rose-400">0</strong>回
                </div>
            </div>
            <div>
                <button id="btn-start-game" class="bg-emerald-600 hover:bg-emerald-500 text-white font-bold px-6 py-3 rounded-xl transition shadow-lg border border-emerald-500/50 flex items-center gap-2">
                    <span>▶ スタート (Q)</span>
                </button>
            </div>
        </section>

        <!-- コントロール・区切りセクション -->
        <section class="mb-5 bg-slate-900/50 p-3 rounded-xl border border-slate-700/50 flex flex-wrap items-center justify-between gap-3 text-sm">
            <div>
                <span class="text-xs text-slate-400 block">現在の区切り</span>
                <span id="current-session-label" class="font-bold text-indigo-300">区切り #1</span>
            </div>
            <div class="flex gap-2">
                <button id="btn-new-session" class="bg-indigo-600/80 hover:bg-indigo-600 text-white text-xs font-semibold px-3 py-1.5 rounded-lg transition">
                    新しい区切り
                </button>
                <button id="btn-reset" class="bg-rose-950/50 hover:bg-rose-900 text-rose-300 text-xs font-medium px-3 py-1.5 rounded-lg transition border border-rose-800/50">
                    全リセット
                </button>
            </div>
        </section>

        <!-- 数字入力セクション (0〜6ボタン) -->
        <section class="mb-6 text-center">
            <div class="flex justify-between items-center mb-2 px-1">
                <label class="text-xs font-medium text-slate-300">数値を入力 (1〜6:数字キー / 0:スペースキー)</label>
                <button id="btn-undo" class="text-xs text-slate-400 hover:text-slate-200 underline disabled:opacity-50" disabled>直前を取り消す (BS / Z)</button>
            </div>
            <div class="grid grid-cols-7 gap-1.5 sm:gap-2">
                <button data-num="0" class="num-btn bg-slate-700/60 hover:bg-slate-600 text-slate-300 text-lg font-bold py-3.5 rounded-xl border border-slate-600/50 transition shadow" title="0 (Space)">0</button>
                <button data-num="1" class="num-btn bg-slate-700 hover:bg-indigo-600 text-lg font-bold py-3.5 rounded-xl border border-slate-600 transition shadow">1</button>
                <button data-num="2" class="num-btn bg-slate-700 hover:bg-indigo-600 text-lg font-bold py-3.5 rounded-xl border border-slate-600 transition shadow">2</button>
                <button data-num="3" class="num-btn bg-slate-700 hover:bg-indigo-600 text-lg font-bold py-3.5 rounded-xl border border-slate-600 transition shadow">3</button>
                <button data-num="4" class="num-btn bg-slate-700 hover:bg-indigo-600 text-lg font-bold py-3.5 rounded-xl border border-slate-600 transition shadow">4</button>
                <button data-num="5" class="num-btn bg-slate-700 hover:bg-indigo-600 text-lg font-bold py-3.5 rounded-xl border border-slate-600 transition shadow">5</button>
                <button data-num="6" class="num-btn bg-slate-700 hover:bg-indigo-600 text-lg font-bold py-3.5 rounded-xl border border-slate-600 transition shadow">6</button>
            </div>
            <div class="mt-2 text-left text-xs text-slate-400 px-1">
                総入力回数: <strong id="total-count" class="text-white">0</strong> 回
            </div>
        </section>

        <!-- 予測ランキングセクション -->
        <section class="mb-6">
            <div class="flex justify-between items-center mb-2.5">
                <h2 class="text-sm font-semibold text-slate-200">🏆 10回以内 出現期待確率ランキング (1-6)</h2>
                <span class="text-xs text-indigo-400 bg-indigo-950 px-2 py-0.5 rounded border border-indigo-800/50">10回スパン最適化</span>
            </div>
            <div id="prediction-list" class="space-y-2">
                <!-- 動的に挿入 -->
            </div>
        </section>

        <!-- 履歴 -->
        <section class="border-t border-slate-700/60 pt-4">
            <div class="flex justify-between items-center mb-2">
                <h3 class="text-xs font-semibold text-slate-300">📜 入力履歴 (直近15件)</h3>
                <span class="text-xs text-slate-500">自動保存対応</span>
            </div>
            <div id="history-container" class="flex flex-wrap gap-1.5 min-h-[36px] bg-slate-900/40 p-2.5 rounded-xl border border-slate-800">
                <span class="text-xs text-slate-500 italic">まだ入力がありません</span>
            </div>
        </section>
    </div>

    <!-- JavaScript ロジック (10回以内予測重視) -->
    <script>
        let state = {
            history: [], 
            sessions: [{ id: 1, name: "区切り #1" }],
            game: {
                active: false,
                targetNum: null,      // スタート時点の予測1位
                remainingCount: 0,    // 残りカウント (10からカウントダウン)
                successCount: 0,      // 的中数
                failCount: 0,         // 外れ数
                failedPatterns: []    // 不的中時の直近パターンデータ
            }
        };

        const INPUT_NUMBERS = [0, 1, 2, 3, 4, 5, 6];
        const TARGET_NUMBERS = [1, 2, 3, 4, 5, 6];

        function loadData() {
            const saved = localStorage.getItem('number_predictor_game_10win_state');
            if (saved) {
                try { state = JSON.parse(saved); } catch (e) { console.error(e); }
            }
            if (!state.game) {
                state.game = { active: false, targetNum: null, remainingCount: 0, successCount: 0, failCount: 0, failedPatterns: [] };
            }
        }

        function saveData() {
            localStorage.setItem('number_predictor_game_10win_state', JSON.stringify(state));
        }

        function getCurrentSessionId() {
            if (state.sessions.length === 0) {
                state.sessions.push({ id: 1, name: "区切り #1" });
            }
            return state.sessions[state.sessions.length - 1].id;
        }

        function startGame() {
            const predictions = calculatePredictions();
            if (predictions.length === 0) return;

            const topNum = predictions[0].num;
            state.game.active = true;
            state.game.targetNum = topNum;
            state.game.remainingCount = 10;
            saveData();
            updateUI();
        }

        function addNumber(num) {
            const parsedNum = parseInt(num);
            if (isNaN(parsedNum) || !INPUT_NUMBERS.includes(parsedNum)) return;
            
            const sessionId = getCurrentSessionId();
            state.history.push({ num: parsedNum, sessionId: sessionId });

            // 10回クール検証中の処理
            if (state.game.active) {
                state.game.remainingCount--;

                // 的中判定 (ターゲット数字が出た場合)
                if (parsedNum === state.game.targetNum) {
                    state.game.successCount++;
                    alert(`🎉 的中！ [${state.game.targetNum}] が10回以内に来ました！`);
                    state.game.active = false;
                    state.game.targetNum = null;
                } 
                // 10回消化しても出なかった場合 (不的中学習)
                else if (state.game.remainingCount <= 0) {
                    state.game.failCount++;
                    const recentSlice = state.history.slice(-6, -1).map(h => h.num);
                    state.game.failedPatterns.push({
                        signature: recentSlice.join(','),
                        target: state.game.targetNum
                    });
                    if (state.game.failedPatterns.length > 50) state.game.failedPatterns.shift();

                    alert(`❌ 不的中... 10回以内に [${state.game.targetNum}] は来ませんでした。（このパターンを学習しました）`);
                    state.game.active = false;
                    state.game.targetNum = null;
                }
            }

            saveData();
            updateUI();
        }

        function undo() {
            if (state.history.length > 0) {
                state.history.pop();
                saveData();
                updateUI();
            }
        }

        function startNewSession() {
            const newId = state.sessions.length + 1;
            state.sessions.push({ id: newId, name: `区切り #${newId}` });
            state.game.active = false;
            saveData();
            updateUI();
        }

        function resetAll() {
            if (confirm("すべての履歴・学習データ・統計をリセットしますか？")) {
                state = { 
                    history: [], 
                    sessions: [{ id: 1, name: "区切り #1" }],
                    game: { active: false, targetNum: null, remainingCount: 0, successCount: 0, failCount: 0, failedPatterns: [] }
                };
                saveData();
                updateUI();
            }
        }

        // --- 10回以内出現確率ロジック ---
        function calculatePredictions() {
            const history = state.history;
            const currentSessionId = getCurrentSessionId();
            const total = history.length;

            let scores = {};
            TARGET_NUMBERS.forEach(n => scores[n] = 100);

            if (total === 0) {
                return formatResults(scores);
            }

            const currentSessionHistory = history.filter(item => item.sessionId === currentSessionId);
            const currentNums = currentSessionHistory.map(item => item.num);
            const sessionTotal = currentNums.length;

            // 1. 直近「10回ウィンドウ」内での勢い（ホットハンド評価）
            if (sessionTotal > 0) {
                const window10 = currentNums.slice(-10);
                window10.forEach((num, idx) => {
                    if (num !== 0) {
                        // 10回以内により直近に出ている数字へ強く重み付け
                        const weight = (idx + 1) * 3.5;
                        scores[num] += weight;
                    }
                });
            }

            // 2. 過去全体の遷移パターン（10回以内の連鎖確率）
            if (total >= 2) {
                const lastNum = history[history.length - 1].num;
                if (lastNum === 0) {
                    // 0（不確定要素）直後は全体の確信度を均等に少し下げる
                    TARGET_NUMBERS.forEach(n => scores[n] *= 0.85);
                } else {
                    let transitionCounts = {};
                    TARGET_NUMBERS.forEach(n => transitionCounts[n] = 0);
                    let transitionTotal = 0;

                    for (let i = 0; i < history.length - 1; i++) {
                        if (history[i].num === lastNum) {
                            const nextNum = history[i + 1].num;
                            if (TARGET_NUMBERS.includes(nextNum)) {
                                transitionCounts[nextNum]++;
                                transitionTotal++;
                            }
                        }
                    }

                    if (transitionTotal > 0) {
                        TARGET_NUMBERS.forEach(n => {
                            const transProb = transitionCounts[n] / transitionTotal;
                            scores[n] += transProb * 55;
                        });
                    }
                }
            }

            // 3. 10回スパンでの近しいペア相関 (1-2, 3-4, 5-6)
            if (sessionTotal > 0) {
                const pairList = [[1, 2], [3, 4], [5, 6]];
                const recent10 = currentNums.slice(-10);

                pairList.forEach(([a, b]) => {
                    const countA = recent10.filter(x => x === a).length;
                    const countB = recent10.filter(x => x === b).length;
                    const recent4 = currentNums.slice(-4);
                    const recentA4 = recent4.filter(x => x === a).length;
                    const recentB4 = recent4.filter(x => x === b).length;

                    // 片方偏り（10回内で片方だけ出ている）
                    if (countA >= 2 && countB === 0) scores[b] -= 15;
                    else if (countB >= 2 && countA === 0) scores[a] -= 15;

                    // 4回以内で連動して共鳴
                    if (recentA4 >= 1 && recentB4 >= 1) {
                        scores[a] += 25;
                        scores[b] += 25;
                    }

                    // 片方が動いた直後のもう片方への連動波及
                    const lastNum = currentNums[currentNums.length - 1];
                    if (lastNum === a && recentB4 === 0) scores[b] += 18;
                    else if (lastNum === b && recentA4 === 0) scores[a] += 18;
                });
            }

            // 4. 過去に10回以内に届かなかった「不的中パターン」の減点補正
            if (state.game.failedPatterns && state.game.failedPatterns.length > 0) {
                const recentSig = currentNums.slice(-4).join(',');
                state.game.failedPatterns.forEach(fp => {
                    if (recentSig.length > 0 && recentSig.includes(fp.signature)) {
                        if (scores[fp.target] !== undefined) {
                            scores[fp.target] -= 40; // 10回以内に来なかった類似パターンの評価を下げる
                        }
                    }
                });
            }

            return formatResults(scores);
        }

        // 10回以内に来る推定確率（%）の計算
        function formatResults(scores) {
            let totalScore = 0;
            TARGET_NUMBERS.forEach(n => {
                if (scores[n] < 1) scores[n] = 1;
                totalScore += scores[n];
            });

            let results = TARGET_NUMBERS.map(n => {
                // 相対的確率から「10回試行内で少なくとも1回以上出現する推定確率」をモデル化
                const baseProb = scores[n] / totalScore; // 1回あたりの期待確率
                const prob10In10 = (1 - Math.pow(1 - baseProb, 6.5)) * 100; // 10回以内出現率換算

                return {
                    num: n,
                    score: scores[n],
                    rate: prob10In10.toFixed(1) + "%"
                };
            });

            results.sort((a, b) => b.score - a.score);
            return results;
        }

        function updateUI() {
            document.getElementById('total-count').textContent = state.history.length;
            document.getElementById('stat-success').textContent = state.game.successCount;
            document.getElementById('stat-fail').textContent = state.game.failCount;

            const currentSession = state.sessions[state.sessions.length - 1];
            document.getElementById('current-session-label').textContent = currentSession ? currentSession.name : "区切り #1";

            const statusText = document.getElementById('game-status-text');
            const startBtn = document.getElementById('btn-start-game');
            if (state.game.active) {
                statusText.innerHTML = `検証中: 10回以内ターゲット <span class="text-amber-300 font-extrabold text-xl">[${state.game.targetNum}]</span> (あと <span class="text-indigo-300">${state.game.remainingCount}回</span>)`;
                startBtn.textContent = "検証中...";
                startBtn.disabled = true;
                startBtn.className = "bg-slate-700 text-slate-400 font-bold px-6 py-3 rounded-xl cursor-not-allowed opacity-60";
            } else {
                statusText.textContent = "待機中 (Qキーでスタート)";
                startBtn.innerHTML = "<span>▶ スタート (Q)</span>";
                startBtn.disabled = false;
                startBtn.className = "bg-emerald-600 hover:bg-emerald-500 text-white font-bold px-6 py-3 rounded-xl transition shadow-lg border border-emerald-500/50 flex items-center gap-2";
            }

            document.getElementById('btn-undo').disabled = state.history.length === 0;

            // 履歴
            const historyContainer = document.getElementById('history-container');
            if (state.history.length === 0) {
                historyContainer.innerHTML = '<span class="text-xs text-slate-500 italic">まだ入力がありません</span>';
            } else {
                historyContainer.innerHTML = '';
                const recent = state.history.slice(-15).reverse();
                recent.forEach((item) => {
                    const badge = document.createElement('span');
                    const isZero = item.num === 0;
                    badge.className = isZero 
                        ? "w-7 h-7 flex items-center justify-center bg-slate-700/50 text-slate-400 font-bold text-xs rounded-lg border border-slate-600/40 shadow-sm"
                        : "w-7 h-7 flex items-center justify-center bg-slate-800 text-indigo-300 font-bold text-xs rounded-lg border border-slate-700 shadow-sm";
                    badge.textContent = item.num;
                    historyContainer.appendChild(badge);
                });
            }

            // ランキング
            const predictions = calculatePredictions();
            const predictionList = document.getElementById('prediction-list');
            predictionList.innerHTML = '';

            predictions.forEach((pred, index) => {
                const rank = index + 1;
                let rankColor = "text-slate-400 bg-slate-800 border-slate-700";
                if (rank === 1) rankColor = "text-amber-300 bg-amber-950/40 border-amber-600/50 font-bold";
                if (rank === 2) rankColor = "text-slate-200 bg-slate-800 border-slate-600 font-bold";
                if (rank === 3) rankColor = "text-amber-600 bg-amber-950/20 border-amber-900/50 font-bold";

                let targetBadge = "";
                if (state.game.active && pred.num === state.game.targetNum) {
                    targetBadge = `<span class="ml-2 text-[10px] bg-amber-500 text-slate-950 px-1.5 py-0.5 rounded font-extrabold animate-pulse">10回以内ターゲット</span>`;
                }

                const itemDiv = document.createElement('div');
                itemDiv.className = `flex items-center justify-between p-2.5 rounded-xl border ${rankColor} transition`;
                
                itemDiv.innerHTML = `
                    <div class="flex items-center gap-2.5">
                        <span class="w-5 text-center text-xs font-semibold">${rank}位</span>
                        <span class="w-8 h-8 flex items-center justify-center bg-indigo-600 text-white font-extrabold rounded-lg shadow text-sm">${pred.num}</span>
                        ${targetBadge}
                    </div>
                    <div class="flex-1 mx-4">
                        <div class="w-full bg-slate-700/60 rounded-full h-2 overflow-hidden">
                            <div class="prediction-bar bg-gradient-to-r from-indigo-500 to-teal-400 h-2 rounded-full" style="width: ${pred.rate}"></div>
                        </div>
                    </div>
                    <div class="text-right">
                        <span class="text-xs font-bold text-slate-200">${pred.rate}</span>
                    </div>
                `;
                predictionList.appendChild(itemDiv);
            });
        }

        document.addEventListener('DOMContentLoaded', () => {
            loadData();
            updateUI();

            document.querySelectorAll('.num-btn').forEach(button => {
                button.addEventListener('click', () => {
                    addNumber(button.getAttribute('data-num'));
                });
            });

            document.getElementById('btn-start-game').addEventListener('click', startGame);
            document.getElementById('btn-undo').addEventListener('click', undo);
            document.getElementById('btn-new-session').addEventListener('click', startNewSession);
            document.getElementById('btn-reset').addEventListener('click', resetAll);

            // PC操作用ショートカット
            document.addEventListener('keydown', (e) => {
                if (['INPUT', 'TEXTAREA', 'SELECT'].includes(document.activeElement.tagName)) return;

                // Qキー: スタート
                if (e.key === 'q' || e.key === 'Q') {
                    if (!state.game.active) startGame();
                    return;
                }

                // スペースキー: 0
                if (e.key === ' ') {
                    e.preventDefault();
                    addNumber(0);
                    return;
                }

                // 1〜6: 数字キー / テンキー
                const validKeys = ['1', '2', '3', '4', '5', '6'];
                if (validKeys.includes(e.key)) {
                    addNumber(e.key);
                } else if (e.key === 'Backspace' || e.key === 'z' || e.key === 'Z') {
                    undo();
                }
            });
        });
    </script>
</body>
</html>
