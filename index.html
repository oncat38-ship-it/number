<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>15連ベイズ確率統計アナライザー (1-6)</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }
        .num-btn:active {
            transform: scale(0.95);
        }
        .prediction-bar {
            transition: width 0.4s ease-in-out;
        }
        @keyframes pulse-gold {
            0%, 100% { border-color: rgba(245, 158, 11, 0.9); box-shadow: 0 0 15px rgba(245, 158, 11, 0.4); }
            50% { border-color: rgba(252, 211, 77, 1); box-shadow: 0 0 25px rgba(252, 211, 77, 0.7); }
        }
        .high-probability-card {
            animation: pulse-gold 2s infinite ease-in-out;
            background: linear-gradient(135deg, rgba(120, 53, 15, 0.4) 0%, rgba(69, 26, 3, 0.6) 100%);
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col items-center py-8 px-4">

    <div class="max-w-2xl w-full bg-slate-800 rounded-2xl shadow-2xl p-6 border border-slate-700">
        <header class="text-center mb-5">
            <h1 class="text-2xl font-bold tracking-tight text-indigo-400">🔢 15連ベイズ統計ハイブリッド予測</h1>
            <p class="text-sm text-slate-400 mt-1">ベイズ更新・ポアソン分布・マルコフ連鎖・エントロピー理論の完全融合モデル</p>
        </header>

        <!-- 15回チャレンジ・スタートパネル -->
        <section class="mb-5 bg-gradient-to-r from-slate-900 via-indigo-950/70 to-slate-900 p-4 rounded-xl border border-indigo-500/30 flex flex-col sm:flex-row items-center justify-between gap-4">
            <div class="text-center sm:text-left">
                <span class="text-xs text-indigo-300 font-semibold uppercase tracking-wider block">🎯 15回チャレンジ検証</span>
                <div class="flex items-baseline gap-2 mt-0.5">
                    <span id="game-status-text" class="text-lg font-bold text-slate-200">待機中 (Qキーでスタート)</span>
                </div>
                <div class="text-xs text-slate-400 mt-1">
                    成功: <strong id="stat-success" class="text-emerald-400">0</strong>回 / 
                    失敗: <strong id="stat-fail" class="text-rose-400">0</strong>回
                </div>
            </div>
            <div>
                <button id="btn-start-game" class="bg-emerald-600 hover:bg-emerald-500 text-white font-bold px-6 py-3 rounded-xl transition shadow-lg border border-emerald-500/50 flex items-center gap-2">
                    <span>▶ 15連スタート (Q)</span>
                </button>
            </div>
        </section>

        <!-- セッション・区切り選択＆日付管理 -->
        <section class="mb-5 bg-slate-900/60 p-3.5 rounded-xl border border-slate-700/50 flex flex-wrap items-center justify-between gap-3 text-sm">
            <div>
                <span class="text-xs text-slate-400 block">本日の記録 (当日枠)</span>
                <span id="today-label" class="font-bold text-indigo-300">----/--/--</span>
                <span class="text-xs text-slate-500 ml-2">(累計: <span id="today-count" class="text-slate-300 font-bold">0</span>件)</span>
            </div>
            <div class="flex gap-2">
                <button id="btn-new-session" class="bg-indigo-600/80 hover:bg-indigo-600 text-white text-xs font-semibold px-3 py-1.5 rounded-lg transition">
                    新しい区切り
                </button>
                <button id="btn-reset" class="bg-rose-950/50 hover:bg-rose-900 text-rose-300 text-xs font-medium px-3 py-1.5 rounded-lg transition border border-rose-800/50">
                    全データリセット
                </button>
            </div>
        </section>

        <!-- 数字入力セクション (0〜6ボタン) -->
        <section class="mb-6 text-center">
            <div class="flex justify-between items-center mb-2 px-1">
                <label class="text-xs font-medium text-slate-300">数値を入力 (1〜6:数字キー / 0:スペースキー)</label>
                <button id="btn-undo" class="text-xs text-indigo-400 hover:text-indigo-200 underline disabled:opacity-40" disabled>直前を取り消す (BS / Z)</button>
            </div>
            <div class="grid grid-cols-7 gap-1.5 sm:gap-2">
                <button data-num="0" class="num-btn bg-slate-700/60 hover:bg-slate-600 text-slate-300 text-lg font-bold py-3.5 rounded-xl border border-slate-600/50 transition shadow" title="0 (Space)">0</button>
                <button data-num="1" class="num-btn bg-slate-700 hover:bg-indigo-600 text-lg font-bold py-3.5 rounded-xl border border-slate-600 transition shadow">1</button>
                <button data-num="2" class="num-btn bg-slate-700 hover:bg-indigo-600 text-lg font-bold py-3.5 rounded-xl border border-slate-600 transition shadow">2</button>
                <button data-num="3" class="num-btn bg-slate-700 hover:bg-indigo-600 text-lg font-bold py-3.5 rounded-xl border border-slate-600 transition shadow">3</button>
                <button data-num="4" class="num-btn bg-slate-700 hover:bg-indigo-600 text-lg font-bold py-3.5 rounded-xl border border-slate-600 transition shadow">4</button>
                <button data-num="5" class="num-btn bg-slate-700 hover:bg-indigo-600 text-lg font-bold py-3.5 rounded-xl border border-slate-600 transition shadow">5</button>
                <button data-num="6" class="num-btn bg-slate-700 hover:bg-indigo-600 text-lg font-bold py-3.5 rounded-xl border border-slate-600 transition shadow">6</button>
            </div>
            <div class="mt-2.5 flex justify-between items-center text-xs text-slate-400 px-1">
                <span>総全履歴数: <strong id="total-count" class="text-white">0</strong> 件</span>
                <span class="text-slate-500">※ベイズ更新・確率統計モデル稼働中</span>
            </div>
        </section>

        <!-- 15回以内出現予測ランキング -->
        <section class="mb-6">
            <div class="flex justify-between items-center mb-2.5">
                <h2 class="text-sm font-semibold text-slate-200">🏆 15回以内 出現確率ランキング (1-6)</h2>
                <span class="text-xs text-amber-400 bg-amber-950/60 px-2 py-0.5 rounded border border-amber-800/50">85%以上ハイライト機能付</span>
            </div>
            <div id="prediction-list" class="space-y-2.5">
                <!-- 動的に挿入 -->
            </div>
        </section>

        <!-- 入力履歴 -->
        <section class="border-t border-slate-700/60 pt-4">
            <div class="flex justify-between items-center mb-2">
                <h3 class="text-xs font-semibold text-slate-300">📜 直近入力履歴 (最新15件)</h3>
                <span class="text-xs text-slate-500">自動保存対応</span>
            </div>
            <div id="history-container" class="flex flex-wrap gap-1.5 min-h-[36px] bg-slate-900/40 p-2.5 rounded-xl border border-slate-800">
                <span class="text-xs text-slate-500 italic">まだ入力がありません</span>
            </div>
        </section>
    </div>

    <!-- JavaScript 確率統計予測エンジン -->
    <script>
        const INPUT_NUMBERS = [0, 1, 2, 3, 4, 5, 6];
        const TARGET_NUMBERS = [1, 2, 3, 4, 5, 6];

        let state = {
            allHistory: [],  // 過去全履歴
            todayDate: getTodayString(),
            sessions: [{ id: 1, name: "区切り #1" }],
            game: {
                active: false,
                targetNum: null,
                remainingCount: 15,
                successCount: 0,
                failCount: 0,
                historyStack: []
            }
        };

        function getTodayString() {
            const d = new Date();
            return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
        }

        function loadData() {
            const saved = localStorage.getItem('number_predictor_bayesian_v1');
            if (saved) {
                try { state = JSON.parse(saved); } catch (e) { console.error(e); }
            }
            const currentToday = getTodayString();
            if (state.todayDate !== currentToday) {
                state.todayDate = currentToday;
            }
            if (!state.game) {
                state.game = { active: false, targetNum: null, remainingCount: 15, successCount: 0, failCount: 0, historyStack: [] };
            }
        }

        function saveData() {
            localStorage.setItem('number_predictor_bayesian_v1', JSON.stringify(state));
        }

        function startGame() {
            const predictions = calculatePredictions();
            if (predictions.length === 0) return;

            const topNum = predictions[0].num;
            state.game.active = true;
            state.game.targetNum = topNum;
            state.game.remainingCount = 15;
            state.game.historyStack = [];
            saveData();
            updateUI();
        }

        function addNumber(num) {
            const parsedNum = parseInt(num);
            if (isNaN(parsedNum) || !INPUT_NUMBERS.includes(parsedNum)) return;
            
            const todayStr = getTodayString();
            state.allHistory.push({ num: parsedNum, date: todayStr });

            if (state.game.active) {
                state.game.remainingCount--;
                state.game.historyStack.push(parsedNum);

                if (parsedNum === state.game.targetNum) {
                    state.game.successCount++;
                    alert(`🎉 的中！ 15回以内にターゲット [${state.game.targetNum}] が出現しました！`);
                    state.game.active = false;
                    state.game.targetNum = null;
                    state.game.historyStack = [];
                } 
                else if (state.game.remainingCount <= 0) {
                    state.game.failCount++;
                    alert(`❌ 15回終了... ターゲット [${state.game.targetNum}] は出ませんでした。`);
                    state.game.active = false;
                    state.game.targetNum = null;
                    state.game.historyStack = [];
                }
            }

            saveData();
            updateUI();
        }

        function undo() {
            if (state.allHistory.length > 0) {
                state.allHistory.pop();
                if (state.game.active && state.game.historyStack.length > 0) {
                    state.game.historyStack.pop();
                    state.game.remainingCount = Math.min(15, state.game.remainingCount + 1);
                }
                saveData();
                updateUI();
            }
        }

        function startNewSession() {
            state.game.active = false;
            state.game.targetNum = null;
            state.game.historyStack = [];
            saveData();
            updateUI();
        }

        function resetAll() {
            if (confirm("すべての記録をリセットしますか？")) {
                state = { 
                    allHistory: [], 
                    todayDate: getTodayString(),
                    sessions: [{ id: 1, name: "区切り #1" }],
                    game: { active: false, targetNum: null, remainingCount: 15, successCount: 0, failCount: 0, historyStack: [] }
                };
                saveData();
                updateUI();
            }
        }

        // --- 本格確率論・統計モデル統合予測エンジン ---
        function calculatePredictions() {
            const allHist = state.allHistory;
            const totalCount = allHist.length;

            let scores = {};
            TARGET_NUMBERS.forEach(n => scores[n] = 100);

            if (totalCount === 0) {
                return formatResults(scores);
            }

            const allNums = allHist.map(h => h.num);
            const todayStr = getTodayString();
            const todayNums = allHist.filter(h => h.date === todayStr).map(h => h.num);

            // ========================================================
            // 1. ベイズ推論モデル (Bayesian Updating)
            // 事前確率（全履歴の基本出現率）に、直近の観測尤度を掛け合わせて事後確率スコアを更新
            // ========================================================
            const globalCounts = {};
            TARGET_NUMBERS.forEach(n => globalCounts[n] = 0);
            allNums.forEach(n => { if (globalCounts[n] !== undefined) globalCounts[n]++; });

            const recentWindow = allNums.slice(-30);
            const recentCounts = {};
            TARGET_NUMBERS.forEach(n => recentCounts[n] = 0);
            recentWindow.forEach(n => { if (recentCounts[n] !== undefined) recentCounts[n]++; });

            TARGET_NUMBERS.forEach(n => {
                const prior = (globalCounts[n] + 1) / (totalCount + 6); // ラプラス平滑化事前確率
                const likelihood = (recentCounts[n] + 1) / (recentWindow.length + 6); // 尤度
                const posterior = prior * likelihood * 1000;
                scores[n] += posterior;
            });

            // ========================================================
            // 2. ポアソン分布モデル (Poisson Probability)
            // 15回スパン内での平均発生回数から「0回である確率の余事象（1回以上起きる確率）」を厳密計算
            // ========================================================
            const lambdaWindow = Math.min(50, allNums.length);
            const lambdaSub = allNums.slice(-lambdaWindow);
            TARGET_NUMBERS.forEach(n => {
                const count = lambdaSub.filter(x => x === n).length;
                const lambda1 = count / lambdaWindow;
                const lambda15 = lambda1 * 15;
                const poissonProb = (1 - Math.exp(-lambda15)) * 100;
                scores[n] += poissonProb * 0.8;
            });

            // ========================================================
            // 3. 高階マルコフ連鎖 (2階 Markov Chain: 直近2つの遷移確率)
            // ========================================================
            if (allNums.length >= 3) {
                const last1 = allNums[allNums.length - 1];
                const last2 = allNums[allNums.length - 2];
                let matchTotal = 0;
                let nextMap = {};
                TARGET_NUMBERS.forEach(n => nextMap[n] = 0);

                for (let i = 0; i < allNums.length - 2; i++) {
                    if (allNums[i] === last2 && allNums[i + 1] === last1) {
                        const nextN = allNums[i + 2];
                        if (nextMap[nextN] !== undefined) {
                            nextMap[nextN]++;
                            matchTotal++;
                        }
                    }
                }
                if (matchTotal > 0) {
                    TARGET_NUMBERS.forEach(n => {
                        scores[n] += (nextMap[n] / matchTotal) * 60;
                    });
                }
            }

            // ========================================================
            // 4. 指数減衰重み付け移動平均 (Exponential Decay)
            // ========================================================
            const alpha = 0.05;
            let expWeights = {};
            TARGET_NUMBERS.forEach(n => expWeights[n] = 0);
            let expTotal = 0;

            for (let i = 0; i < allNums.length; i++) {
                const age = allNums.length - 1 - i;
                const w = Math.exp(-alpha * age);
                const num = allNums[i];
                if (expWeights[num] !== undefined) expWeights[num] += w;
                expTotal += w;
            }
            if (expTotal > 0) {
                TARGET_NUMBERS.forEach(n => {
                    scores[n] += (expWeights[n] / expTotal) * 45;
                });
            }

            // ========================================================
            // 5. ハマり・過剰連投の統計的抑制（極端な偏りの自動補正）
            // ========================================================
            // 直近20回で過剰に出ている数字の冷却補正
            const recent20 = allNums.slice(-20);
            TARGET_NUMBERS.forEach(n => {
                const c20 = recent20.filter(x => x === n).length;
                if (c20 >= 8) scores[n] -= 70;
                else if (c20 >= 6) scores[n] -= 25;
            });

            // 当日データのシナジー補正
            if (todayNums.length > 0) {
                todayNums.slice(-10).forEach(n => {
                    if (scores[n] !== undefined) scores[n] += 5;
                });
            }

            return formatResults(scores);
        }

        // スコアを15回以内出現の期待確率（%）へ変換
        function formatResults(scores) {
            let totalScore = 0;
            TARGET_NUMBERS.forEach(n => {
                if (scores[n] < 1) scores[n] = 1;
                totalScore += scores[n];
            });

            let results = TARGET_NUMBERS.map(n => {
                const baseProb = scores[n] / totalScore;
                const prob15 = (1 - Math.pow(1 - baseProb, 9.2)) * 100;

                return {
                    num: n,
                    score: scores[n],
                    rateVal: Math.min(99.4, Math.max(5.0, prob15)),
                    rateStr: Math.min(99.4, Math.max(5.0, prob15)).toFixed(1) + "%"
                };
            });

            results.sort((a, b) => b.rateVal - a.rateVal);
            return results;
        }

        function updateUI() {
            const todayStr = getTodayString();
            document.getElementById('today-label').textContent = todayStr;

            const todayList = state.allHistory.filter(h => h.date === todayStr);
            document.getElementById('today-count').textContent = todayList.length;
            document.getElementById('total-count').textContent = state.allHistory.length;

            document.getElementById('stat-success').textContent = state.game.successCount;
            document.getElementById('stat-fail').textContent = state.game.failCount;

            const statusText = document.getElementById('game-status-text');
            const startBtn = document.getElementById('btn-start-game');

            if (state.game.active) {
                statusText.innerHTML = `チャレンジ中: ターゲット <span class="text-amber-300 font-extrabold text-xl">[${state.game.targetNum}]</span> (残り <span class="text-indigo-300 font-bold">${state.game.remainingCount}回</span>)`;
                startBtn.textContent = "15連チャレンジ中...";
                startBtn.disabled = true;
                startBtn.className = "bg-slate-700 text-slate-400 font-bold px-6 py-3 rounded-xl cursor-not-allowed opacity-60";
            } else {
                statusText.textContent = "待機中 (Qキーでスタート)";
                startBtn.innerHTML = "<span>▶ 15連スタート (Q)</span>";
                startBtn.disabled = false;
                startBtn.className = "bg-emerald-600 hover:bg-emerald-500 text-white font-bold px-6 py-3 rounded-xl transition shadow-lg border border-emerald-500/50 flex items-center gap-2";
            }

            document.getElementById('btn-undo').disabled = state.allHistory.length === 0;

            const historyContainer = document.getElementById('history-container');
            if (state.allHistory.length === 0) {
                historyContainer.innerHTML = '<span class="text-xs text-slate-500 italic">まだ入力がありません</span>';
            } else {
                historyContainer.innerHTML = '';
                const recent = state.allHistory.slice(-15).reverse();
                recent.forEach((item) => {
                    const badge = document.createElement('span');
                    const isZero = item.num === 0;
                    badge.className = isZero 
                        ? "w-7 h-7 flex items-center justify-center bg-slate-700/50 text-slate-400 font-bold text-xs rounded-lg border border-slate-600/40 shadow-sm"
                        : "w-7 h-7 flex items-center justify-center bg-slate-800 text-indigo-300 font-bold text-xs rounded-lg border border-slate-700 shadow-sm";
                    badge.textContent = item.num;
                    historyContainer.appendChild(badge);
                });
            }

            const predictions = calculatePredictions();
            const predictionList = document.getElementById('prediction-list');
            predictionList.innerHTML = '';

            predictions.forEach((pred, index) => {
                const rank = index + 1;
                const isHighProb = pred.rateVal >= 85.0;

                let rankStyle = "text-slate-400 bg-slate-800 border-slate-700";
                if (isHighProb) {
                    rankStyle = "high-probability-card border-2 text-amber-200 font-bold shadow-lg";
                } else if (rank === 1) {
                    rankStyle = "text-amber-300 bg-amber-950/40 border-amber-600/50 font-bold";
                } else if (rank === 2) {
                    rankStyle = "text-slate-200 bg-slate-800 border-slate-600 font-bold";
                } else if (rank === 3) {
                    rankStyle = "text-amber-600 bg-amber-950/20 border-amber-900/50 font-bold";
                }

                let targetBadge = "";
                if (state.game.active && pred.num === state.game.targetNum) {
                    targetBadge = `<span class="ml-2 text-[10px] bg-amber-500 text-slate-950 px-1.5 py-0.5 rounded font-extrabold animate-pulse">15連ターゲット</span>`;
                }

                let highProbBadge = "";
                if (isHighProb) {
                    highProbBadge = `<span class="ml-2 text-[10px] bg-amber-400 text-slate-950 px-2 py-0.5 rounded-full font-black tracking-wider uppercase animate-bounce">🔥 超高確率 85%超</span>`;
                }

                const itemDiv = document.createElement('div');
                itemDiv.className = `flex items-center justify-between p-3 rounded-xl border ${rankStyle} transition`;
                
                itemDiv.innerHTML = `
                    <div class="flex items-center gap-2.5">
                        <span class="w-5 text-center text-xs font-semibold">${rank}位</span>
                        <span class="w-9 h-9 flex items-center justify-center ${isHighProb ? 'bg-amber-500 text-slate-950' : 'bg-indigo-600 text-white'} font-extrabold rounded-lg shadow text-base">${pred.num}</span>
                        ${targetBadge}
                        ${highProbBadge}
                    </div>
                    <div class="flex-1 mx-4">
                        <div class="w-full bg-slate-700/60 rounded-full h-2.5 overflow-hidden">
                            <div class="prediction-bar ${isHighProb ? 'bg-gradient-to-r from-amber-400 via-amber-300 to-yellow-200' : 'bg-gradient-to-r from-indigo-500 to-teal-400'} h-2.5 rounded-full" style="width: ${pred.rateStr}"></div>
                        </div>
                    </div>
                    <div class="text-right">
                        <span class="${isHighProb ? 'text-base font-extrabold text-amber-300' : 'text-xs font-bold text-slate-200'}">${pred.rateStr}</span>
                    </div>
                `;
                predictionList.appendChild(itemDiv);
            });
        }

        document.addEventListener('DOMContentLoaded', () => {
            loadData();
            updateUI();

            document.querySelectorAll('.num-btn').forEach(button => {
                button.addEventListener('click', () => {
                    addNumber(button.getAttribute('data-num'));
                });
            });

            document.getElementById('btn-start-game').addEventListener('click', startGame);
            document.getElementById('btn-undo').addEventListener('click', undo);
            document.getElementById('btn-new-session').addEventListener('click', startNewSession);
            document.getElementById('btn-reset').addEventListener('click', resetAll);

            document.addEventListener('keydown', (e) => {
                if (['INPUT', 'TEXTAREA', 'SELECT'].includes(document.activeElement.tagName)) return;

                if (e.key === 'q' || e.key === 'Q') {
                    if (!state.game.active) startGame();
                    return;
                }

                if (e.key === ' ') {
                    e.preventDefault();
                    addNumber(0);
                    return;
                }

                const validKeys = ['1', '2', '3', '4', '5', '6'];
                if (validKeys.includes(e.key)) {
                    addNumber(e.key);
                } else if (e.key === 'Backspace' || e.key === 'z' || e.key === 'Z') {
                    undo();
                }
            });
        });
    </script>
</body>
</html>
